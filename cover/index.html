<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WPPT episode · v1 featured card</title>
    <link rel="stylesheet" href="assets/fonts/noto.css" />
    <link rel="stylesheet" href="assets/brand/wppt-tokens.css" />
    <link rel="stylesheet" href="wppt-episode.css" />
  </head>
  <body>
    <div class="wpep-canvas wpep--v1-rf" data-asset-canvas data-wppt-variation="v1-rf">
      <div class="wpep-gradient" aria-hidden="true"></div>
      <div class="wpep-pattern wpep-pattern--bokeh" id="wppt-pattern" aria-hidden="true"></div>
      <div class="wpep-vignette" aria-hidden="true"></div>
      <article class="wpep-card">
        <header class="wpep-top">
          <div class="wpep-brand">
            <img class="wpep-wordmark" src="assets/wppt-wordmark.svg" alt="WP Product Talk" width="218" height="58" />
          </div>
          <div class="wpep-top-meta">
            <p class="wpep-eyebrow wpep-eyebrow--pill" data-wppt-field="eyebrow" data-rf-contrast="aa">Episode 214</p>
            <span class="wpep-live" data-wppt-field="live">LIVE!</span>
          </div>
        </header>
        <div class="wpep-body">
          <div class="wpep-hero">
            <h1 class="wpep-title" data-wppt-field="title" data-rf-contrast="aa-large">Data-driven product decisions</h1>
            <svg class="wpep-swash" viewBox="0 0 360 18" fill="none" aria-hidden="true">
              <path d="M4 13.5 C86 3.2, 224 2.4, 356 12.2 C252 7.8, 114 8.4, 18 15.6 C10 16.1, 3 14.8, 4 13.5 Z" fill="#FED000"/>
            </svg>
            <p class="wpep-lede" data-rf-contrast="aa">
              <span class="wpep-lede__prefix" data-wppt-field="guestPrefix">with special guest:</span>
              <span class="wpep-lede__guest">
                <strong class="wpep-lede__name" data-wppt-field="guestName">Derek Hinchcliffe</strong>
                <svg class="wpep-lede__sparkles" viewBox="0 0 180 54" fill="none" aria-hidden="true">
                  <!-- tilted 4-point AuroraText-style stars scattered across & to the right of the guest name -->
                  <g transform="translate(18 8) rotate(-14) scale(0.95)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#7c5ce6"/>
                  </g>
                  <g transform="translate(68 42) rotate(12) scale(0.55)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#e879a8"/>
                  </g>
                  <g transform="translate(106 10) rotate(-18) scale(0.85)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#7c5ce6"/>
                  </g>
                  <g transform="translate(124 41) rotate(16) scale(1.08)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#e879a8"/>
                  </g>
                  <g transform="translate(154 22) rotate(-10) scale(0.78)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#a81de9"/>
                  </g>
                  <g transform="translate(169 37) rotate(22) scale(0.48)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#7c5ce6"/>
                  </g>
                  <g transform="translate(142 8) rotate(8) scale(0.42)">
                    <path d="M0 -9 C1.8 -1.8 1.8 -1.8 9 0 C1.8 1.8 1.8 1.8 0 9 C-1.8 1.8 -1.8 1.8 -9 0 C-1.8 -1.8 -1.8 -1.8 0 -9Z" fill="#e879a8"/>
                  </g>
                </svg>
              </span>
            </p>
          </div>
          <div class="wpep-cohosts-wrap" id="wppt-cohosts-wrap">
            <p class="wpep-cohosts-label" data-rf-contrast="aa">With co-hosts:</p>
            <div class="wpep-cohosts" id="wppt-cohosts" aria-label="Co-hosts"></div>
          </div>
        </div>
        <footer class="wpep-foot">
          <div class="wpep-foot-left">
            <div class="wpep-bar" aria-hidden="true"><span></span><span></span><span></span></div>
            <p class="wpep-meta" data-rf-contrast="aa"><strong data-wppt-field="date">Nov 18, 2026</strong></p>
          </div>
        </footer>
      </article>
      <div class="wpep-guest"><img id="wppt-guest" src="assets/guest-placeholder.svg" alt="" /></div>
    </div>
    <script type="module" src="assets/wppt-live.js"></script>
  </body>
</html>
